<style>
    .nf-wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 112px 40px 120px;
        text-align: center;
    }

    /* ── Lost-trail map ─────────────────────── */
    .nf-map {
        width: 100%;
        max-width: 480px;
        margin: 0 auto 36px;
    }
    .nf-map svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
    }
    .nf-tile {
        fill: var(--glass);
    }
    .nf-tile-edge {
        fill: none;
        stroke: var(--border-accent);
        stroke-width: 1;
    }
    .nf-contours use {
        fill: none;
        stroke: rgba(34,197,94,0.28);
        stroke-width: 1.2;
        vector-effect: non-scaling-stroke;
    }
    .nf-contours .nf-contour-top {
        stroke: rgba(134,239,172,0.55);
    }
    .nf-lake {
        fill: rgba(var(--premium-rgb),0.16);
        stroke: rgba(var(--premium-rgb),0.45);
        stroke-width: 1;
    }
    .nf-summit path {
        fill: var(--text-dim);
    }
    .nf-summit text {
        fill: var(--text);
        font: 600 12px var(--font-display);
        letter-spacing: 0.04em;
    }

    .nf-trail {
        fill: none;
        stroke: #f97316;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 520;
        stroke-dashoffset: 520;
        animation: nf-draw 2.4s cubic-bezier(.4,.1,.3,1) 0.3s forwards;
    }
    .nf-trail-off {
        stroke-width: 2.5;
        stroke-dasharray: 2 7;
        stroke-dashoffset: 0;
        opacity: 0;
        animation: nf-fade 0.5s ease 2.6s forwards;
    }
    .nf-start {
        fill: var(--bg);
        stroke: #f97316;
        stroke-width: 3;
    }
    .nf-pin {
        opacity: 0;
        animation: nf-pin 0.6s cubic-bezier(.3,1.6,.5,1) 3s forwards;
    }
    .nf-pin path {
        fill: var(--surface);
        stroke: #f97316;
        stroke-width: 2;
    }
    .nf-pin text {
        fill: #f97316;
        font: 700 16px var(--font-display);
    }

    @keyframes nf-draw { to { stroke-dashoffset: 0; } }
    @keyframes nf-fade { to { opacity: 1; } }
    @keyframes nf-pin {
        from { opacity: 0; transform: translate(440px, 20px); }
        to   { opacity: 1; transform: translate(440px, 40px); }
    }

    @media (prefers-reduced-motion: reduce) {
        .nf-trail, .nf-trail-off, .nf-pin { animation: none; opacity: 1; stroke-dashoffset: 0; }
        .nf-trail:not(.nf-trail-off) { stroke-dasharray: none; }
    }

    /* ── Copy ───────────────────────────────── */
    .nf-wrap .section-heading {
        font-size: clamp(1.9em, 4.5vw, 2.8em);
    }
    .nf-desc {
        color: var(--text-dim);
        max-width: 460px;
        margin: 0 auto 18px;
        line-height: 1.75;
    }
    .nf-gps {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 36px;
        padding: 6px 14px 6px 6px;
        border: 1px solid var(--border);
        border-radius: 100px;
        background: var(--glass);
        color: var(--text-dim);
        font: 500 0.8em ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .nf-gps span {
        padding: 2px 8px;
        border-radius: 100px;
        background: var(--green-soft);
        color: var(--green);
        font-weight: 700;
        letter-spacing: 0.08em;
    }
    .nf-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    @media (max-width: 560px) {
        .nf-wrap { padding: 88px 16px 80px; }
        .nf-gps { font-size: 0.72em; }
        .nf-actions { flex-direction: column; align-items: stretch; }
        .nf-actions a { justify-content: center; }
    }
</style>
